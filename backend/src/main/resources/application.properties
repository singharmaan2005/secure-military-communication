server.port=8080

# Persistent H2 Database for FIELDLINK C2 Store
spring.datasource.url=jdbc:h2:file:./data/fieldlinkdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for debugging/inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Operational / Tactical Security Properties
fieldlink.tactical.system-id=FIELDLINK-TACTICAL-CORE-V1
fieldlink.tactical.classification=RESTRICTED // TACTICAL SIMULATION
fieldlink.tactical.ledger-label=LOCAL HASH-LINKED LEDGER SIMULATION
